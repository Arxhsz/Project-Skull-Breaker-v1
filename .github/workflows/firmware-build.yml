name: Firmware Build

on:
  pull_request:
  push:
    branches:
      - main
      - fix/radio-lifecycle-ui-flicker

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ESP32 firmware
        id: firmware-build
        shell: bash
        run: |
          set -o pipefail
          pio run -e esp32dev 2>&1 | tee platformio-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-build-log
          path: platformio-build.log
          if-no-files-found: error
          retention-days: 7
