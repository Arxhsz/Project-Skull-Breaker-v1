[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:tools/apply_radio_detection_patch.py

build_flags =
    -DORION_GIT_HASH=dev
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_NIMBLE_CPP_ENABLE_ADVERTISEMENT_RESULTS_TEXT=0
    -DCONFIG_NIMBLE_CPP_ENABLE_GAP_EVENT_CODE_TEXT=0
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=0
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_ATT_VALUE_TIMESTAMP_ENABLED=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -Wl,-z,muldefs
    -Wl,--wrap=_Z17handleRFProtocolsv
    -Wl,--wrap=_Z23drawRadio24ActiveScreenv
    -Wl,--wrap=_Z16runPacketFlooderv
    -Wl,--wrap=_Z11runRFJammerv
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DLOG_LOCAL_LEVEL=0

monitor_speed = 115200
upload_speed = 115200
upload_port = COM4
monitor_port = COM4
upload_resetmethod = nodemcu

board_build.filesystem = littlefs
board_build.partitions = partitions_orion_ota.csv

lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
  nrf24/RF24
  h2zero/NimBLE-Arduino
